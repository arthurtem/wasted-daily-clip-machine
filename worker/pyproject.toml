[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipmachine"
version = "0.1.0"
description = "Wasted Daily clip machine worker"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "yt-dlp>=2024.12.13",
    "mediapipe==0.10.21",
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.24,<2",
    "faster-whisper>=1.1",
    "pytesseract>=0.3.13",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
clipmachine = "clipmachine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clipmachine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: requires a real DATABASE_URL and is skipped otherwise",
]
