name: Fetch and render clips

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      WHISPER_CACHE_DIR: .cache/whisper
      GAME_NAME: ${{ secrets.GAME_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=()
          for var in DATABASE_URL TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET BLOB_READ_WRITE_TOKEN; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing GitHub repository secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 tesseract-ocr fonts-dejavu-core

      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: .cache/whisper
          key: whisper-small-${{ runner.os }}-v1

      - name: Install Blob helper
        run: npm ci --prefix worker/scripts

      - name: Install worker
        run: pip install -e "worker"

      - name: Fetch clips
        run: python -m clipmachine fetch

      - name: Render clips
        run: python -m clipmachine render
