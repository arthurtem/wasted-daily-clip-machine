name: Upload approved clips

on:
  workflow_dispatch:
    inputs:
      delay:
        description: Wait one upload slot before uploading
        required: false
        type: string
        default: "false"
      thumbnail_test:
        description: Compose and set a custom thumbnail for this upload
        required: false
        type: string
        default: "false"

permissions:
  contents: read
  actions: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      UPLOAD_MODE: api
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=()
          for var in DATABASE_URL BLOB_READ_WRITE_TOKEN; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing GitHub repository secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lightweight gate dependencies
        run: pip install "psycopg[binary]>=3.1" "PyYAML>=6.0" "requests>=2"

      - name: Install Blob helper only
        run: npm ci --prefix worker/scripts

      - name: Expire stale clips and check upload policy
        id: gate
        run: PYTHONPATH=worker python -m clipmachine.upload_gate

  upload:
    needs: preflight
    if: needs.preflight.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      UPLOAD_MODE: api
      YT_SET_THUMBNAIL: ${{ inputs.thumbnail_test == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=()
          for var in DATABASE_URL GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET TOKEN_ENCRYPTION_KEY BLOB_READ_WRITE_TOKEN; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing GitHub repository secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Install Blob helper
        run: npm ci --prefix worker/scripts

      - name: Install worker
        run: pip install -e "worker"

      - name: Wait for next upload slot
        if: inputs.delay == 'true'
        run: sleep 600

      - name: Upload approved clip
        run: python -m clipmachine upload

      - name: Check for another approved clip
        id: next
        run: PYTHONPATH=worker python -m clipmachine.upload_gate

      - name: Queue the next upload
        if: steps.next.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run upload.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f delay=true
