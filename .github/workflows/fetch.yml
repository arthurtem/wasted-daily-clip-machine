name: Fetch clips

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: Twitch game name
        required: false
        type: string
      streamers:
        description: Comma-separated Twitch logins (blank = all enabled)
        required: false
        type: string
      min_views:
        description: Minimum clip views (blank = config value)
        required: false
        type: string
      scope:
        description: category or streamers (blank = config value)
        required: false
        type: string
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: clip-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      GAME_NAME: ${{ inputs.game_name || secrets.GAME_NAME }}
      STREAMERS: ${{ inputs.streamers }}
      MIN_VIEWS: ${{ inputs.min_views }}
      CLIP_SCOPE: ${{ inputs.scope }}
      FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      AUTO_RENDER_IDS_FILE: auto_render_ids.txt
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=()
          for var in DATABASE_URL TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing GitHub repository secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker
        run: pip install -e "worker"

      - name: Fetch clips
        run: python -m clipmachine fetch

      - name: Read auto-render ids
        id: auto
        run: |
          if [ -s auto_render_ids.txt ]; then
            ids=$(tr '\n' ',' < auto_render_ids.txt | sed 's/,$//')
            echo "clip_ids=$ids" >> "$GITHUB_OUTPUT"
          else
            echo "clip_ids=" >> "$GITHUB_OUTPUT"
          fi

      - name: Queue auto-render
        if: steps.auto.outputs.clip_ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run render.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "clip_ids=${{ steps.auto.outputs.clip_ids }}" \
            -f "auto_render=true"
